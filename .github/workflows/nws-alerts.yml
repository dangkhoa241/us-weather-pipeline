# NWS active alerts → MongoDB Atlas (M0, free), on demand. Normally collected hourly by the AWS Lambda (docs/SETUP_AWS.md step 10).
# Local Mongo gets the data with `npm run sync:atlas`. Setup: docs/SETUP_CLOUD_COLLECTION.md
name: NWS alerts

on:
  # Manual fallback only: the schedule moved to AWS Lambda + EventBridge (Stage 6a part 3; GitHub skipped scheduled runs).
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nws-alerts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGO_DB: weather
      RAW_RETENTION_DAYS: "7"       # TTL index: 53 cities ≈ 47 MB/day of NWS data, 7 days stay under Atlas M0's 512 MB
      NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT }}
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: dependency install scripts never run (and never see the Atlas secret)
      - run: npm ci --omit=dev --ignore-scripts
      # The Atlas connection string is given only to the steps that need it.
      - name: Check configuration
        env:
          MONGO_URI: ${{ secrets.ATLAS_MONGO_URI }}
        run: |
          test -n "$MONGO_URI" || { echo "::error::Secret ATLAS_MONGO_URI is not set"; exit 1; }
          test -n "$NWS_USER_AGENT" || { echo "::error::Variable NWS_USER_AGENT is not set"; exit 1; }
      - name: Seed locations (idempotent; resolves NWS grid points only for new cities)
        env:
          MONGO_URI: ${{ secrets.ATLAS_MONGO_URI }}
        run: npm run seed:locations
      - name: Fetch NWS alerts
        env:
          MONGO_URI: ${{ secrets.ATLAS_MONGO_URI }}
        run: node fetchWeather.js alerts
