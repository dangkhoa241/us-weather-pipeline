# NWS forecasts → MongoDB Atlas (M0, free) every 3 hours, so collection doesn't need a laptop running.
# Local Mongo gets the data with `npm run sync:atlas`. Setup: docs/SETUP_CLOUD_COLLECTION.md
name: NWS forecasts

on:
  schedule:
    - cron: "7 */3 * * *"      # minute 7: GitHub delays jobs scheduled exactly on the hour the most
  workflow_dispatch: {}        # "Run workflow" button for testing

permissions:
  contents: read               # least privilege: the job only needs to read the code

concurrency:
  group: nws-forecasts
  cancel-in-progress: false    # never run two collections at once; a late run waits

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGO_URI: ${{ secrets.ATLAS_MONGO_URI }}
      MONGO_DB: weather
      NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT }}
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Check configuration
        run: |
          test -n "$MONGO_URI" || { echo "::error::Secret ATLAS_MONGO_URI is not set"; exit 1; }
          test -n "$NWS_USER_AGENT" || { echo "::error::Variable NWS_USER_AGENT is not set"; exit 1; }
      - name: Seed locations (idempotent; resolves NWS grid points only for new cities)
        run: npm run seed:locations
      - name: Fetch NWS forecasts
        run: node fetchWeather.js forecast
