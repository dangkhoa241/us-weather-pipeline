# Local infrastructure for the pipeline: MongoDB (raw store), ClickHouse (warehouse), Redis (cache).
# Usage: docker compose up -d   |   docker compose ps   |   docker compose down (add -v to wipe data)
services:
  mongo:
    image: mongo:7
    container_name: weather-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: weather-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-weather_dw}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-weather}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-weather}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface (used by @clickhouse/client)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: weather-redis
    # Bounded cache: past 64 MB, evict least-recently-used keys that have a TTL (cached query results).
    # Keys without a TTL (data-version pointer, hit/miss counters) are never evicted.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Stage 1 watcher: NWS/Open-Meteo forecasts, alerts and daily history on the cron schedules in .env.
  # Restarts with Docker Desktop, so forecast collection keeps going without a terminal open.
  # Logs: docker compose logs -f fetcher
  fetcher:
    build: .
    container_name: weather-fetcher
    command: ["node", "fetchWeather.js", "--watch"]
    env_file:
      - path: .env
        required: false          # defaults from src/config.js apply when .env is missing
    environment:
      # Service names on the compose network (override localhost from .env).
      MONGO_URI: mongodb://mongo:27017
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_URL: redis://redis:6379
      # The runtime AWS profile is mounted at /home/node/.aws (see volumes); host paths from .env don't apply here.
      AWS_SHARED_CREDENTIALS_FILE: /home/node/.aws/credentials
      AWS_CONFIG_FILE: /home/node/.aws/config
      # NWS alerts and forecasts come from the AWS Lambda (Stage 6a part 3) and reach this store via sync-atlas.
      # Running alerts here too would email each new heat alert twice; forecasts would only duplicate requests and S3 PUTs.
      ALERTS_CRON: "off"
      FORECAST_CRON: "off"
    depends_on:
      mongo:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # AWS credentials for NOTIFIER=sns: read-only, only when AWS_CONFIG_DIR is set in .env (else an empty folder).
      # Point it at a folder holding only the publish-only weather-runtime profile, never the deploy keys.
      - ${AWS_CONFIG_DIR:-./infra/no-aws}:/home/node/.aws:ro
    init: true                   # forwards SIGTERM so `docker compose stop` shuts the watcher down cleanly
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }   # cap log disk use

volumes:
  mongo-data:
  clickhouse-data:
  redis-data:
